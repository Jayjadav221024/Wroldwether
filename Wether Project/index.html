<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wether App By Jay Jadav</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./asset/clear.png">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter City Name" spellcheck="false">
            <button><img src="./asset/search.png"></button>
        </div>
        <div class="error">
            <p>invalid city Name</p>
        </div>
        <div class="wether">
            <img src="./asset/rain.png" class="wether-icon" alt="">
            <h1 class="temp">22*C</h1>
            <h2 class="city">New York</h2>
            <div class="details">
                <div class="col">
                    <img src="./asset/humidity.png">
                    <div>
                        <p class="humidity">50%</p>
                        <p>humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="./asset/wind.png">
                    <div>
                        <p class="wind">15 km/h</p>
                        <p>wind speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
